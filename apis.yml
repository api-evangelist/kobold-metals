aid: kobold-metals
name: KoBold Metals
description: 'KoBold Metals is a critical-minerals exploration and development company
  that applies artificial intelligence and machine learning to the search for the copper,
  lithium, nickel and cobalt deposits needed for electrification. The company combines
  three capabilities: novel sensor hardware and software that collect higher-quality
  subsurface data faster, centralized data systems that organize disparate geological
  information about the Earth''s crust, and predictive models that rank and target
  exploration prospects. Its stated aim is to "turn exploration into a repeatable science."
  Its flagship project is Mingomba in Zambia, described by the company as one of the
  best copper deposits ever found and positioned to become one of the world''s largest
  copper mines. KoBold is venture-backed (investors include a16z and Bond Capital)
  and operates as a private exploration company. As of this profile it publishes no
  public developer API, SDK, or developer portal; the public surface is a corporate
  marketing, science, careers and news site.'
